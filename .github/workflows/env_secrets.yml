# REPO:  actions-playground
# RUN:   Actions tab > "Environment secrets" > Run workflow
# SHOWS: two jobs read a secret with the SAME name (DEPLOY_TOKEN) but get DIFFERENT values,
#        because each job names a different environment.
name: Environment secrets

on: workflow_dispatch          # run by hand, with the "Run workflow" button

jobs:
  staging:
    runs-on: ubuntu-24.04
    environment: staging       # NEW: use the "staging" environment (its own secrets and rules, set in Settings)
    steps:
      - name: Show which token this environment gave us (never the value)
        env:
          # HABIT 1: copy the secret into an environment variable. GitHub puts the real value
          # in before the script runs and hides it in the logs. Only this step can see it.
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          # HABIT 2: the script reads the variable with $DEPLOY_TOKEN. ${#DEPLOY_TOKEN} is its LENGTH.
          # We print the length, never the value.
          if [ -z "$DEPLOY_TOKEN" ]; then echo "no DEPLOY_TOKEN in staging"; else echo "staging DEPLOY_TOKEN has ${#DEPLOY_TOKEN} characters"; fi

  production:
    runs-on: ubuntu-24.04
    needs: staging             # wait for the staging job to finish first (Day 1)
    environment: production    # NEW: a different environment, so DEPLOY_TOKEN has a different value here.
                               # If this environment has "required reviewers", the job waits for approval.
    steps:
      - name: Show which token this environment gave us (never the value)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then echo "no DEPLOY_TOKEN in production"; else echo "production DEPLOY_TOKEN has ${#DEPLOY_TOKEN} characters"; fi
